name: inglizcha
description: "American English learning app with English, Russian, and Uzbek interface languages"
publish_to: 'none'
version: 1.1.0+2
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.3
  flutter_secure_storage: ^9.2.4
  http: ^1.5.0
  shared_preferences: ^2.5.4
  speech_to_text: ^7.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/vocabulary.json
    - assets/app_icon.png
